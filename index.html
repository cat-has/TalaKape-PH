<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>TalaKape PH</title>
<meta name="description" content="Brew timer, PH coffee guide, bean journal and cafe directory.">
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32x32.png"><link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16x16.png">
<link rel="shortcut icon" href="favicon.ico"><link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="TalaKape PH"><meta name="theme-color" content="#2C1A12">
<link rel="stylesheet" href="css/styles.css"></head><body>
<nav id="nav"><div class="brand">TalaKape PH</div>
<a href="#brew" data-v="brew">Brew</a><a href="#origins" data-v="origins">Origins</a><a href="#journal" data-v="journal">Journal</a><a href="#cafes" data-v="cafes">Cafes</a></nav>
<main>
<header><span id="net" class="pill on">Online</span><button id="installBtn" hidden>Install app</button></header>
<section id="brew" class="view"><h2>Brew timer</h2>
<label>Preset <select id="preset"></select></label>
<div class="row"><label>Ratio 1:<span id="rv">15</span><input id="ratio" type="range" min="12" max="18" value="15"></label>
<label>Coffee (g)<input id="coffee" type="number" min="1" value="20"></label></div>
<p class="big"><span id="water">300</span> ml water</p>
<ol id="steps"></ol><div class="clock" id="clock">00:00</div><p id="stepNow" class="muted">Ready</p>
<div class="row"><button id="start">Start</button><button id="reset" class="ghost">Reset</button></div></section>
<section id="origins" class="view"><h2>Philippine origins</h2><div class="chips" id="vfilter"></div><div id="ocards" class="grid"></div></section>
<section id="journal" class="view"><h2>Kape journal</h2>
<form id="jform" class="grid form"><input name="roaster" placeholder="Roaster" required><input name="origin" placeholder="Origin" required>
<select name="variety"><option>Arabica</option><option>Robusta</option><option>Liberica</option><option>Excelsa</option></select><input name="process" placeholder="Process (washed, natural...)">
<label>Roast date<input type="date" name="roastDate" required></label><input name="price" type="number" min="0" placeholder="Price (PHP)">
<select name="rating"><option value="5">5 stars</option><option value="4">4 stars</option><option value="3">3 stars</option><option value="2">2 stars</option><option value="1">1 star</option></select><input name="notes" placeholder="Tasting notes"><button>Save bag</button></form>
<div id="jlist" class="grid"></div></section>
<section id="cafes" class="view"><h2>Work-friendly cafes</h2>
<form id="cform" class="grid form"><input name="name" placeholder="Cafe name" required><select name="city"><option>Metro Manila</option><option>Cebu</option><option>Davao</option><option>Baguio</option><option>Iloilo</option><option>Pampanga</option><option>Other</option></select>
<input name="drink" placeholder="Signature drink"><label><input type="checkbox" name="wifi"> Good Wi-Fi</label><label><input type="checkbox" name="power"> Power sockets</label><label><input type="checkbox" name="parking"> Parking</label><label><input type="checkbox" name="pets"> Pet-friendly</label><button>Add cafe</button></form>
<label>City <select id="cfilter"><option value="">All</option></select></label><div id="clist" class="grid"></div></section>
</main>
<div id="toast" hidden><span>New version ready.</span><button id="reload">Reload</button></div>
<div id="ios" hidden><div class="card"><h3>Add to Home Screen</h3><p>Tap the Share button, then "Add to Home Screen".</p><button id="iosClose">Got it</button></div></div>
<script src="js/app.js"></script></body></html>
