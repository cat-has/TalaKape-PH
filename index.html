<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>TalaKape PH</title>
<meta name="description" content="Brew timer, PH coffee guide, bean journal and cafe directory.">
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32x32.png"><link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16x16.png">
<link rel="shortcut icon" href="favicon.ico"><link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="TalaKape PH"><meta name="theme-color" content="#2C1A12">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=JetBrains+Mono:wght@500;700&family=Plus+Jakarta+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./css/styles.css"></head><body>
<nav id="nav"><div class="brand"><svg viewBox="0 0 64 64" width="34" height="34"><rect width="64" height="64" rx="14" fill="#C86D51"/><path d="M14 20h36l-6 10H20z" fill="#FAF6F0"/><path d="M22 32h20l-3 16H25z" fill="#2C1A12"/></svg><span>TalaKape PH</span></div>
<a href="#brew" data-v="brew"><svg viewBox="0 0 24 24"><path d="M4 8h13v5a5 5 0 0 1-5 5H9a5 5 0 0 1-5-5zM17 9h2a2 2 0 0 1 0 5h-2M8 3v2M12 3v2"/></svg><span>Brew</span></a>
<a href="#origins" data-v="origins"><svg viewBox="0 0 24 24"><path d="M3 20l6-11 4 6 3-4 5 9z"/></svg><span>Origins</span></a>
<a href="#journal" data-v="journal"><svg viewBox="0 0 24 24"><path d="M6 3h12v18H6zM9 8h6M9 12h6"/></svg><span>Journal</span></a>
<a href="#cafes" data-v="cafes"><svg viewBox="0 0 24 24"><path d="M12 21s7-6 7-11a7 7 0 0 0-14 0c0 5 7 11 7 11z"/><circle cx="12" cy="10" r="2.5"/></svg><span>Cafes</span></a>
<div class="tip"><b>Daily brew tip</b><p id="tip"></p></div></nav>
<main>
<header><h1 id="title">Brew studio</h1><div><span id="net" class="pill on">Online</span> <button id="installBtn" hidden>Install app</button></div></header>
<section id="brew" class="view"><div class="bento">
<div class="glass"><h2>Recipe</h2><div class="presets" id="presets"></div>
<label>Ratio 1:<b id="rv">15</b><input id="ratio" type="range" min="12" max="18" value="15"></label>
<label>Coffee dose (g)<input id="coffee" type="number" min="1" value="20"></label>
<div class="kpis"><div><small>Coffee</small><b id="kc">20 g</b></div><div><small>Water</small><b id="water">300 ml</b></div><div><small>Temp</small><b id="kt">93 °C</b></div><div><small>Grind</small><b id="kg">Medium</b></div></div></div>
<div class="glass center"><div class="ringwrap"><svg viewBox="0 0 240 240" width="240" height="240"><circle class="trk" cx="120" cy="120" r="104"/><circle id="ring" cx="120" cy="120" r="104"/></svg><div class="mid"><div id="clock">00:00</div><div id="stepNow">Ready</div></div></div>
<div id="steps" class="pills"></div><div class="row"><button id="start">Start</button><button id="reset" class="ghost">Reset</button></div></div></div></section>
<section id="origins" class="view"><div class="row"><input id="osearch" type="search" placeholder="Search region, notes..."></div><div class="pills" id="vfilter"></div><div id="ocards" class="grid"></div></section>
<section id="journal" class="view"><div class="bento"><form id="jform" class="glass form"><h2>Log a bag</h2><input name="roaster" placeholder="Roaster" required><input name="origin" placeholder="Origin" required>
<select name="variety"><option>Arabica</option><option>Robusta</option><option>Liberica</option><option>Excelsa</option></select><input name="process" placeholder="Process (washed, natural...)">
<label>Roast date<input type="date" name="roastDate" required></label><input name="price" type="number" min="0" placeholder="Price (PHP)">
<select name="rating"><option value="5">5 stars</option><option value="4">4 stars</option><option value="3">3 stars</option><option value="2">2 stars</option><option value="1">1 star</option></select><input name="notes" placeholder="Tasting notes"><button>Save bag</button></form>
<div id="jlist" class="stack"></div></div></section>
<section id="cafes" class="view"><div class="bento"><form id="cform" class="glass form"><h2>Add a cafe</h2><input name="name" placeholder="Cafe name" required><select name="city" id="ccity"></select><input name="drink" placeholder="Signature drink">
<div class="pills" id="toggles"></div><button>Add cafe</button></form>
<div><label>City<select id="cfilter"><option value="">All</option></select></label><div id="clist" class="stack"></div></div></div></section>
</main>
<div id="toast" hidden><span>New version ready.</span><button id="reload">Reload</button></div>
<div id="ios" hidden><div class="glass"><h3>Add to Home Screen</h3><p>Tap the Share button, then "Add to Home Screen".</p><button id="iosClose">Got it</button></div></div>
<script src="./js/app.js"></script></body></html>
